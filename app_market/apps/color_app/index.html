<!--
文件作用：颜色选择器应用
依赖：无
输入：用户点击颜色选项
输出：显示选中的颜色
实现方式：使用JavaScript和CSS更新颜色显示
-->
<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>颜色应用</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%);
            color: #ffffff;
            height: 100vh;
            display: flex;
            flex-direction: column;
        }
        .top-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 16px 20px;
            background: rgba(0, 0, 0, 0.3);
            backdrop-filter: blur(10px);
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
        }
        .app-title {
            font-size: 18px;
            font-weight: 500;
            color: #f57309;
        }
        .close-btn {
            width: 36px;
            height: 36px;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.1);
            border: none;
            color: #ffffff;
            font-size: 20px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.2s ease;
        }
        .close-btn:hover {
            background: rgba(245, 115, 9, 0.3);
            transform: rotate(90deg);
        }
        .close-btn:active {
            transform: rotate(90deg) scale(0.9);
        }
        .container {
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-align: center;
            padding: 40px;
        }
        .card {
            padding: 40px;
            background: rgba(255, 255, 255, 0.05);
            border-radius: 16px;
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.1);
        }
        h1 {
            font-size: 32px;
            margin-bottom: 40px;
            color: #f57309;
        }
        .color-display {
            width: 200px;
            height: 200px;
            border-radius: 50%;
            margin: 40px auto;
            background: #f57309;
            transition: all 0.3s ease;
            border: 4px solid rgba(255, 255, 255, 0.3);
        }
        .color-picker {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 12px;
            margin: 20px 0;
        }
        .color-option {
            width: 60px;
            height: 60px;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.2s ease;
            border: 3px solid transparent;
        }
        .color-option:hover {
            transform: scale(1.1);
            border-color: rgba(255, 255, 255, 0.5);
        }
        .color-code {
            margin-top: 20px;
            font-family: 'Courier New', monospace;
            font-size: 18px;
            padding: 10px 20px;
            background: rgba(0, 0, 0, 0.3);
            border-radius: 8px;
        }
    </style>
</head>
<body>
    <div class="top-bar">
        <div class="app-title">颜色选择器</div>
        <button class="close-btn" onclick="closeWindow()" aria-label="关闭">✕</button>
    </div>
    <div class="container">
        <div class="card">
            <div class="color-display" id="colorDisplay"></div>
            <div class="color-code" id="colorCode">#f57309</div>
            <div class="color-picker">
                <div class="color-option" style="background: #f57309;" data-color="#f57309"></div>
                <div class="color-option" style="background: #3498db;" data-color="#3498db"></div>
                <div class="color-option" style="background: #2ecc71;" data-color="#2ecc71"></div>
                <div class="color-option" style="background: #9b59b6;" data-color="#9b59b6"></div>
                <div class="color-option" style="background: #e74c3c;" data-color="#e74c3c"></div>
                <div class="color-option" style="background: #1abc9c;" data-color="#1abc9c"></div>
                <div class="color-option" style="background: #f39c12;" data-color="#f39c12"></div>
                <div class="color-option" style="background: #e91e63;" data-color="#e91e63"></div>
            </div>
        </div>
    </div>
    <script>
        const colorDisplay = document.getElementById('colorDisplay');
        const colorCode = document.getElementById('colorCode');
        const colorOptions = document.querySelectorAll('.color-option');
        
        function closeWindow() {
            try {
                if (typeof NeoPod !== 'undefined' && NeoPod.close) {
                    NeoPod.close();
                } else {
                    window.close();
                }
            } catch (error) {
                console.log('无法关闭窗口:', error);
            }
        }
        
        colorOptions.forEach(option => {
            option.addEventListener('click', function() {
                const color = this.dataset.color;
                colorDisplay.style.background = color;
                colorCode.textContent = color;
                
                colorDisplay.style.transform = 'scale(1.1)';
                setTimeout(() => {
                    colorDisplay.style.transform = 'scale(1)';
                }, 200);
            });
        });
    </script>
</body>
</html>
