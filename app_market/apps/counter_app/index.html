<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>计数器应用</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%);
            color: #ffffff;
            height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }
        .container {
            text-align: center;
            padding: 40px;
            background: rgba(255, 255, 255, 0.05);
            border-radius: 16px;
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.1);
        }
        h1 {
            font-size: 32px;
            margin-bottom: 40px;
            color: #f57309;
        }
        .counter {
            font-size: 96px;
            font-weight: 200;
            margin: 40px 0;
            transition: all 0.2s ease;
        }
        .buttons {
            display: flex;
            gap: 16px;
            justify-content: center;
        }
        .btn {
            padding: 16px 32px;
            border: none;
            border-radius: 12px;
            font-size: 18px;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.2s ease;
            background: #f57309;
            color: #ffffff;
        }
        .btn:hover {
            background: #ff8c3b;
            transform: scale(1.05);
        }
        .btn:active {
            transform: scale(0.95);
        }
        .btn-secondary {
            background: rgba(255, 255, 255, 0.1);
        }
        .btn-secondary:hover {
            background: rgba(255, 255, 255, 0.2);
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>计数器</h1>
        <div class="counter" id="counter">0</div>
        <div class="buttons">
            <button class="btn btn-secondary" onclick="decrement()">-</button>
            <button class="btn" onclick="increment()">+</button>
            <button class="btn btn-secondary" onclick="reset()">重置</button>
        </div>
    </div>
    <script>
        let count = 0;
        const counterEl = document.getElementById('counter');
        
        function increment() {
            count++;
            updateCounter();
        }
        
        function decrement() {
            count--;
            updateCounter();
        }
        
        function reset() {
            count = 0;
            updateCounter();
        }
        
        function updateCounter() {
            counterEl.textContent = count;
            counterEl.style.transform = 'scale(1.1)';
            setTimeout(() => {
                counterEl.style.transform = 'scale(1)';
            }, 100);
        }
    </script>
</body>
</html>
