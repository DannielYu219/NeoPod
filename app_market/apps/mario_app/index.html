<!--
文件作用：复古像素风格Mario类横版卷轴游戏
依赖：无外部依赖，纯HTML/CSS/JavaScript实现
输入：键盘方向键/WASD控制移动跳跃，触屏按钮控制，USB手柄支持
输出：游戏画面渲染、分数显示、游戏状态
实现方式：使用Canvas绘制像素风格图形，实现物理引擎、碰撞检测、关卡系统
          支持横屏模式，支持标准USB手柄(Gamepad API)
-->

    <script>
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        
        const TILE_SIZE = 16;
        const SCALE = 3;
        const SCALED_TILE = TILE_SIZE * SCALE;
        
        let canvasWidth, canvasHeight, tilesX, tilesY;
        let isLandscape = false;
        let gamepadIndex = null;
        let gamepadConnected = false;
        
        function checkOrientation() {
            const isLandscapeNow = window.innerWidth > window.innerHeight;
            
            if (isLandscapeNow !== isLandscape) {
                isLandscape = isLandscapeNow;
                document.body.classList.toggle('landscape-mode', isLandscape);
                document.body.classList.toggle('portrait-mode', !isLandscape);
                
                setTimeout(resizeCanvas, 100);
            }
        }
        
        function resizeCanvas() {
            const container = document.querySelector('.game-container');
            let maxWidth = container.clientWidth - 16;
            let maxHeight = container.clientHeight - 16;
            
            if (isLandscape) {
                const targetRatio = 2.1;
                const containerRatio = maxWidth / maxHeight;
                
                if (containerRatio > targetRatio) {
                    maxHeight = Math.min(maxHeight, maxWidth / targetRatio);
                    maxWidth = maxHeight * targetRatio;
                } else {
                    maxWidth = Math.min(maxWidth, maxHeight * targetRatio);
                    maxHeight = maxWidth / targetRatio;
                }
            }
            
            tilesX = Math.floor(maxWidth / SCALED_TILE);
            tilesY = Math.floor(maxHeight / SCALED_TILE);
            
            if (isLandscape) {
                const ratio = tilesX / tilesY;
                if (ratio > 2.1) {
                    tilesX = Math.floor(tilesY * 2.1);
                } else if (ratio < 2.0) {
                    tilesY = Math.floor(tilesX / 2.0);
                }
                tilesX = Math.max(14, Math.min(tilesX, 22));
                tilesY = Math.max(7, Math.min(tilesY, 11));
            } else {
                tilesX = Math.max(10, Math.min(tilesX, 16));
                tilesY = Math.max(8, Math.min(tilesY, 10));
            }
            
            canvasWidth = tilesX * SCALED_TILE;
            canvasHeight = tilesY * SCALED_TILE;
            
            canvas.width = canvasWidth;
            canvas.height = canvasHeight;
            canvas.style.width = canvasWidth + 'px';
            canvas.style.height = canvasHeight + 'px';
        }
        
        checkOrientation();
        window.addEventListener('resize', checkOrientation);
        window.addEventListener('orientationchange', () => {
            setTimeout(checkOrientation, 100);
        });
        
        function handleGamepadConnected(e) {
            gamepadIndex = e.gamepad.index;
            gamepadConnected = true;
            document.getElementById('gamepadIndicator').classList.add('connected');
            document.getElementById('controllerHint').textContent = '🎮 ' + e.gamepad.id.substring(0, 20) + '...';
            console.log('Gamepad connected:', e.gamepad.id);
        }
        
        function handleGamepadDisconnected(e) {
            if (e.gamepad.index === gamepadIndex) {
                gamepadIndex = null;
                gamepadConnected = false;
                document.getElementById('gamepadIndicator').classList.remove('connected');
                document.getElementById('controllerHint').textContent = '';
            }
        }
        
        window.addEventListener('gamepadconnected', handleGamepadConnected);
        window.addEventListener('gamepaddisconnected', handleGamepadDisconnected);
        
        function pollGamepad() {
            if (gamepadIndex === null) return;
            
            const gamepads = navigator.getGamepads();
            const gp = gamepads[gamepadIndex];
            
            if (!gp) return;
            
            const deadzone = 0.2;
            const axisX = gp.axes[0] || 0;
            
            if (Math.abs(axisX) > deadzone) {
                keys.gamepadAxis = axisX;
                keys.left = axisX < -deadzone;
                keys.right = axisX > deadzone;
            } else {
                keys.gamepadAxis = 0;
                if (!keys.leftBtn && !keys.rightBtn) {
                    keys.left = false;
                    keys.right = false;
                }
            }
            
            if (gp.buttons[0] && gp.buttons[0].pressed) {
                keys.jump = true;
            } else if (!keys.jumpBtn) {
                keys.jump = false;
            }
            
            if (gp.buttons[14] && gp.buttons[14].pressed) {
                keys.left = true;
                keys.leftBtn = true;
            } else {
                keys.leftBtn = false;
            }
            if (gp.buttons[15] && gp.buttons[15].pressed) {
                keys.right = true;
                keys.rightBtn = true;
            } else {
                keys.rightBtn = false;
            }
            if (gp.buttons[12] && gp.buttons[12].pressed) {
                keys.jump = true;
                keys.jumpBtn = true;
            } else {
                keys.jumpBtn = false;
            }
            
            if (gp.buttons[9] && gp.buttons[9].pressed && !gameState.isPlaying) {
                startGame();
            }
        }
        
        const COLORS = {
            sky: '#5c94fc',
            ground: '#c84c0c',
            groundDark: '#9c4a0c',
            brick: '#c84c0c',
            brickDark: '#9c4a0c',
            coin: '#fcbcb0',
            coinDark: '#c84c0c',
            player: '#c84c0c',
            playerDark: '#9c4a0c',
            playerSkin: '#fcbcb0',
            enemy: '#c84c0c',
            enemyDark: '#9c4a0c',
            pipe: '#00a800',
            pipeDark: '#005800',
            cloud: '#fcfcfc',
            bush: '#00a800',
            bushDark: '#005800'
        };
        
        let gameState = {
            score: 0,
            coins: 0,
            lives: 3,
            level: 1,
            isPlaying: false,
            isPaused: false,
            cameraX: 0
        };
        
        let player = {
            x: 2 * SCALED_TILE,
            y: 0,
            vx: 0,
            vy: 0,
            width: SCALED_TILE - 4,
            height: SCALED_TILE * 1.5,
            onGround: false,
            facingRight: true,
            frame: 0,
            frameTimer: 0
        };
        
        let platforms = [];
        let coins = [];
        let enemies = [];
        let particles = [];
        let levelWidth = 0;
        
        const GRAVITY = 0.5;
        const JUMP_FORCE = -16;
        const MOVE_SPEED = 5;
        const MAX_FALL_SPEED = 12;
        
        const keys = {
            left: false,
            right: false,
            jump: false,
            gamepadAxis: 0
        };
        
        function generateLevel() {
            platforms = [];
            coins = [];
            enemies = [];
            levelWidth = tilesX * 10 * SCALED_TILE;
            
            const level = gameState.level;
            
            for (let x = 0; x < tilesX * 10; x++) {
                let groundHeight = 2;
                
                if (level === 1) {
                    if (x > 8 && x < 11) groundHeight = 0;
                    if (x > 18 && x < 21) groundHeight = 0;
                    if (x > 28 && x < 31) groundHeight = 0;
                    if (x > 38 && x < 41) groundHeight = 1;
                    if (x > 48 && x < 51) groundHeight = 1;
                    if (x > 58 && x < 61) groundHeight = 0;
                    if (x > 68 && x < 71) groundHeight = 1;
                } else if (level === 2) {
                    if (x > 6 && x < 9) groundHeight = 0;
                    if (x > 12 && x < 15) groundHeight = 0;
                    if (x > 18 && x < 22) groundHeight = 0;
                    if (x > 26 && x < 29) groundHeight = 1;
                    if (x > 34 && x < 37) groundHeight = 0;
                    if (x > 42 && x < 46) groundHeight = 1;
                    if (x > 52 && x < 55) groundHeight = 0;
                    if (x > 60 && x < 64) groundHeight = 0;
                    if (x > 70 && x < 74) groundHeight = 1;
                } else {
                    if (x > 5 && x < 8) groundHeight = 0;
                    if (x > 10 && x < 14) groundHeight = 0;
                    if (x > 16 && x < 20) groundHeight = 1;
                    if (x > 24 && x < 27) groundHeight = 0;
                    if (x > 30 && x < 34) groundHeight = 0;
                    if (x > 38 && x < 42) groundHeight = 1;
                    if (x > 46 && x < 50) groundHeight = 0;
                    if (x > 54 && x < 58) groundHeight = 1;
                    if (x > 62 && x < 66) groundHeight = 0;
                    if (x > 70 && x < 75) groundHeight = 0;
                }
                
                for (let y = tilesY - groundHeight; y < tilesY; y++) {
                    platforms.push({
                        x: x * SCALED_TILE,
                        y: y * SCALED_TILE,
                        width: SCALED_TILE,
                        height: SCALED_TILE,
                        type: 'ground'
                    });
                }
            }
            
            let floatingPlatforms = [];
            let coinPositions = [];
            let enemyPositions = [];
            
            if (level === 1) {
                floatingPlatforms = [
                    { x: 9, y: tilesY - 5, w: 3 },
                    { x: 19, y: tilesY - 4, w: 3 },
                    { x: 29, y: tilesY - 5, w: 3 },
                    { x: 39, y: tilesY - 4, w: 3 },
                    { x: 49, y: tilesY - 5, w: 3 },
                    { x: 59, y: tilesY - 4, w: 3 },
                    { x: 69, y: tilesY - 5, w: 3 },
                    { x: 80, y: tilesY - 4, w: 3 }
                ];
                coinPositions = [
                    { x: 4, y: tilesY - 3 },
                    { x: 10, y: tilesY - 6 },
                    { x: 11, y: tilesY - 6 },
                    { x: 20, y: tilesY - 5 },
                    { x: 21, y: tilesY - 5 },
                    { x: 30, y: tilesY - 6 },
                    { x: 40, y: tilesY - 5 },
                    { x: 50, y: tilesY - 6 },
                    { x: 60, y: tilesY - 5 },
                    { x: 70, y: tilesY - 6 },
                    { x: 15, y: tilesY - 3 },
                    { x: 25, y: tilesY - 3 },
                    { x: 35, y: tilesY - 3 },
                    { x: 45, y: tilesY - 3 },
                    { x: 55, y: tilesY - 3 },
                    { x: 65, y: tilesY - 3 },
                    { x: 75, y: tilesY - 3 }
                ];
                enemyPositions = [
                    { x: 12, y: tilesY - 3 },
                    { x: 24, y: tilesY - 3 },
                    { x: 36, y: tilesY - 3 },
                    { x: 46, y: tilesY - 4 },
                    { x: 56, y: tilesY - 3 },
                    { x: 66, y: tilesY - 3 },
                    { x: 76, y: tilesY - 4 }
                ];
            } else if (level === 2) {
                floatingPlatforms = [
                    { x: 7, y: tilesY - 5, w: 3 },
                    { x: 13, y: tilesY - 4, w: 3 },
                    { x: 20, y: tilesY - 5, w: 4 },
                    { x: 27, y: tilesY - 4, w: 3 },
                    { x: 35, y: tilesY - 5, w: 3 },
                    { x: 43, y: tilesY - 4, w: 4 },
                    { x: 53, y: tilesY - 5, w: 3 },
                    { x: 62, y: tilesY - 4, w: 4 },
                    { x: 72, y: tilesY - 5, w: 3 },
                    { x: 82, y: tilesY - 4, w: 3 }
                ];
                coinPositions = [
                    { x: 4, y: tilesY - 3 },

        function drawPixelRect(x, y, w, h, color) {
            ctx.fillStyle = color;
            ctx.fillRect(Math.floor(x), Math.floor(y), w, h);
        }
        
        function drawGround(x, y) {
            const tx = Math.floor(x - gameState.cameraX);
            const ty = Math.floor(y);
            
            drawPixelRect(tx, ty, SCALED_TILE, SCALED_TILE / 4, COLORS.ground);
            drawPixelRect(tx, ty + SCALED_TILE / 4, SCALED_TILE, SCALED_TILE * 3 / 4, COLORS.groundDark);
            
            ctx.fillStyle = COLORS.ground;
            for (let i = 0; i < 4; i++) {
                ctx.fillRect(tx + i * (SCALED_TILE / 4), ty, SCALED_TILE / 8, SCALED_TILE / 4);
            }
        }
        
        function drawBrick(x, y) {
            const tx = Math.floor(x - gameState.cameraX);
            const ty = Math.floor(y);
            
            drawPixelRect(tx, ty, SCALED_TILE, SCALED_TILE, COLORS.brick);
            drawPixelRect(tx, ty, SCALED_TILE, 3, COLORS.brickDark);
            drawPixelRect(tx, ty + SCALED_TILE / 2 - 1, SCALED_TILE, 3, COLORS.brickDark);
            drawPixelRect(tx + SCALED_TILE / 2 - 1, ty, 3, SCALED_TILE, COLORS.brickDark);
            drawPixelRect(tx, ty + SCALED_TILE - 3, SCALED_TILE, 3, COLORS.brickDark);
        }
        
        function drawPlayer() {
            const px = Math.floor(player.x - gameState.cameraX);
            const py = Math.floor(player.y);
            const w = player.width;
            const h = player.height;
            
            ctx.save();
            
            if (!player.facingRight) {
                ctx.translate(px + w, py);
                ctx.scale(-1, 1);
                ctx.translate(-px, -py);
            }
            
            drawPixelRect(px, py, w, h / 3, COLORS.playerSkin);
            drawPixelRect(px + w / 6, py + 2, w / 6, w / 6, COLORS.playerDark);
            
            drawPixelRect(px, py + h / 3, w, h / 3, COLORS.player);
            drawPixelRect(px + w / 3, py + h / 3 + 2, w / 6, w / 6, COLORS.coin);
            
            drawPixelRect(px, py + h * 2 / 3, w / 3, h / 3, COLORS.playerDark);
            drawPixelRect(px + w * 2 / 3, py + h * 2 / 3, w / 3, h / 3, COLORS.playerDark);
            
            if (!player.onGround && player.vy < 0) {
                drawPixelRect(px + w / 3, py + h - 4, w / 6, 8, COLORS.playerDark);
                drawPixelRect(px + w / 2, py + h - 4, w / 6, 8, COLORS.playerDark);
            } else if (Math.abs(player.vx) > 0.5) {
                const legOffset = Math.sin(player.frame * 0.5) * 4;
                drawPixelRect(px + w / 4, py + h - 4 + legOffset, w / 4, 8, COLORS.playerDark);
                drawPixelRect(px + w / 2, py + h - 4 - legOffset, w / 4, 8, COLORS.playerDark);
            } else {
                drawPixelRect(px + w / 4, py + h - 4, w / 4, 8, COLORS.playerDark);
                drawPixelRect(px + w / 2, py + h - 4, w / 4, 8, COLORS.playerDark);
            }
            
            ctx.restore();
        }
        
        function drawCoin(coin) {
            if (coin.collected) return;
            
            const cx = Math.floor(coin.x - gameState.cameraX);
            const cy = Math.floor(coin.y);
            const size = coin.width;
            
            coin.frame += 0.1;
            const scaleX = Math.abs(Math.cos(coin.frame));
            
            ctx.fillStyle = COLORS.coin;
            ctx.beginPath();
            ctx.ellipse(cx + size / 2, cy + size / 2, size / 2 * scaleX, size / 2, 0, 0, Math.PI * 2);
            ctx.fill();
            
            if (scaleX > 0.3) {
                ctx.fillStyle = COLORS.coinDark;
                ctx.fillRect(cx + size / 2 - 2, cy + size / 4, 4, size / 2);
            }
        }
        
        function drawEnemy(enemy) {
            if (!enemy.alive) return;
            
            const ex = Math.floor(enemy.x - gameState.cameraX);
            const ey = Math.floor(enemy.y);
            const w = enemy.width;
            const h = enemy.height;
            
            drawPixelRect(ex, ey + h / 4, w, h * 3 / 4, COLORS.enemy);
            drawPixelRect(ex, ey, w, h / 4, COLORS.enemyDark);
            
            drawPixelRect(ex + w / 6, ey + h / 3, w / 6, w / 6, '#fff');
            drawPixelRect(ex + w * 2 / 3 - w / 6, ey + h / 3, w / 6, w / 6, '#fff');
            drawPixelRect(ex + w / 6 + 2, ey + h / 3 + 2, w / 10, w / 10, '#000');
            drawPixelRect(ex + w * 2 / 3 - w / 6 + 2, ey + h / 3 + 2, w / 10, w / 10, '#000');
            
            enemy.frame += 0.1;
            const footOffset = Math.sin(enemy.frame) * 2;
            drawPixelRect(ex, ey + h - 4, w / 3, 6, COLORS.enemyDark);
            drawPixelRect(ex + w * 2 / 3, ey + h - 4 + footOffset, w / 3, 6, COLORS.enemyDark);
        }
        
        function drawCloud(x, y, size) {
            const cx = Math.floor(x - gameState.cameraX * 0.3);
            ctx.fillStyle = COLORS.cloud;
            ctx.beginPath();
            ctx.arc(cx, y, size, 0, Math.PI * 2);
            ctx.arc(cx + size * 1.2, y - size * 0.3, size * 0.8, 0, Math.PI * 2);
            ctx.arc(cx + size * 2, y, size * 0.9, 0, Math.PI * 2);
            ctx.fill();
        }
        
        function drawBush(x, y, size) {
            const bx = Math.floor(x - gameState.cameraX);
            ctx.fillStyle = COLORS.bush;
            ctx.beginPath();
            ctx.arc(bx, y, size, 0, Math.PI * 2);
            ctx.arc(bx + size * 1.5, y, size * 1.2, 0, Math.PI * 2);
            ctx.arc(bx + size * 3, y, size * 0.9, 0, Math.PI * 2);
            ctx.fill();
        }
        
        function drawBackground() {
            ctx.fillStyle = COLORS.sky;
            ctx.fillRect(0, 0, canvasWidth, canvasHeight);
            
            drawCloud(50, 40, 20);
            drawCloud(200, 60, 25);
            drawCloud(400, 35, 18);
            drawCloud(600, 55, 22);
            drawCloud(800, 45, 20);
            
            drawBush(100, canvasHeight - SCALED_TILE * 2 - 15, 12);
            drawBush(350, canvasHeight - SCALED_TILE * 2 - 15, 15);
            drawBush(600, canvasHeight - SCALED_TILE * 2 - 15, 10);
        }
        
        function drawParticles() {
            particles.forEach((p, i) => {
                p.x += p.vx;
                p.y += p.vy;
                p.vy += 0.3;
                p.life--;
                
                if (p.life <= 0) {
                    particles.splice(i, 1);
                    return;
                }
                
                const alpha = p.life / p.maxLife;
                ctx.fillStyle = p.color;
                ctx.globalAlpha = alpha;
                ctx.fillRect(p.x - gameState.cameraX, p.y, p.size, p.size);
                ctx.globalAlpha = 1;
            });
        }
        
        function createParticles(x, y, color, count) {
            for (let i = 0; i < count; i++) {
                particles.push({
                    x: x,
                    y: y,
                    vx: (Math.random() - 0.5) * 6,
                    vy: (Math.random() - 1) * 8,
                    size: Math.random() * 6 + 2,
                    color: color,
                    life: 30,
                    maxLife: 30
                });
            }
        }
        
        function updatePlayer() {
            let moveSpeed = MOVE_SPEED;
            
            if (Math.abs(keys.gamepadAxis) > 0.2) {
                moveSpeed = MOVE_SPEED * Math.abs(keys.gamepadAxis);
                moveSpeed = Math.max(MOVE_SPEED * 0.3, Math.min(MOVE_SPEED * 1.2, moveSpeed));
            }
            
            if (keys.left) {
                player.vx = -moveSpeed;
                player.facingRight = false;
            }
            if (keys.right) {
                player.vx = moveSpeed;
                player.facingRight = true;
            }
            if (!keys.left && !keys.right) {
                player.vx *= 0.8;
            }
            
            if (keys.jump && player.onGround) {
                player.vy = JUMP_FORCE;
                player.onGround = false;
            }
            
            player.vy += GRAVITY;
            if (player.vy > MAX_FALL_SPEED) player.vy = MAX_FALL_SPEED;
            
            player.x += player.vx;
            player.y += player.vy;
            
            if (Math.abs(player.vx) > 0.5) {
                player.frameTimer++;
                if (player.frameTimer > 5) {
                    player.frame++;
                    player.frameTimer = 0;
                }
            }
            
            player.onGround = false;
            
            platforms.forEach(platform => {
                if (checkCollision(player, platform)) {
                    const overlapTop = (player.y + player.height) - platform.y;
                    const overlapBottom = (platform.y + platform.height) - player.y;
                    const overlapLeft = (player.x + player.width) - platform.x;
                    const overlapRight = (platform.x + platform.width) - player.x;
                    
                    const minOverlapY = Math.min(overlapTop, overlapBottom);
                    const minOverlapX = Math.min(overlapLeft, overlapRight);
                    
                    if (minOverlapY < minOverlapX) {
                        if (overlapTop < overlapBottom && player.vy > 0) {
                            player.y = platform.y - player.height;
                            player.vy = 0;
                            player.onGround = true;
                        } else if (player.vy < 0) {
                            player.y = platform.y + platform.height;
                            player.vy = 0;
                        }
                    } else {
                        if (overlapLeft < overlapRight) {
                            player.x = platform.x - player.width;
                        } else {
                            player.x = platform.x + platform.width;
                        }
                        player.vx = 0;
                    }
                }
            });
            
            if (player.x < 0) player.x = 0;
            if (player.x > levelWidth - player.width) {
                nextLevel();
            }
            
            if (player.y > canvasHeight) {
                playerDie();
            }
            
            const targetCameraX = player.x - canvasWidth / 3;
            gameState.cameraX += (targetCameraX - gameState.cameraX) * 0.1;
            if (gameState.cameraX < 0) gameState.cameraX = 0;
            if (gameState.cameraX > levelWidth - canvasWidth) gameState.cameraX = levelWidth - canvasWidth;
        }
        
        function updateEnemies() {
            enemies.forEach(enemy => {
                if (!enemy.alive) return;
                
                enemy.x += enemy.vx;
                
                let onPlatform = false;
                platforms.forEach(platform => {
                    if (enemy.x + enemy.width > platform.x && 
                        enemy.x < platform.x + platform.width &&
                        enemy.y + enemy.height >= platform.y &&
                        enemy.y + enemy.height <= platform.y + 10) {
                        onPlatform = true;
                    }
                });
                
                if (!onPlatform || enemy.x < 0) {
                    enemy.vx *= -1;
                }
                
                if (checkCollision(player, enemy)) {
                    if (player.vy > 0 && player.y + player.height < enemy.y + enemy.height / 2) {
                        enemy.alive = false;
                        player.vy = JUMP_FORCE / 2;
                        gameState.score += 100;
                        updateUI();
                        createParticles(enemy.x + enemy.width / 2, enemy.y + enemy.height / 2, COLORS.enemy, 10);
                    } else {
                        playerDie();
                    }
                }
            });
        }
        
        function updateCoins() {
            coins.forEach(coin => {
                if (coin.collected) return;
                
                const coinHitbox = {
                    x: coin.x,
                    y: coin.y,
                    width: coin.width,
                    height: coin.height
                };
                
                if (checkCollision(player, coinHitbox)) {
                    coin.collected = true;
                    gameState.coins++;
                    gameState.score += 50;
                    updateUI();
                    createParticles(coin.x + coin.width / 2, coin.y + coin.height / 2, COLORS.coin, 8);
                }
            });
        }
        
        function checkCollision(a, b) {
            return a.x < b.x + b.width &&
                   a.x + a.width > b.x &&
                   a.y < b.y + b.height &&
                   a.y + a.height > b.y;
        }
        
        function playerDie() {
            gameState.lives--;
            updateUI();
            
            if (gameState.lives <= 0) {
                gameOver();
            } else {
                resetPlayer();
            }
        }
        
        function resetPlayer() {
            player.x = 2 * SCALED_TILE;
            player.y = canvasHeight - SCALED_TILE * 4;
            player.vx = 0;
            player.vy = 0;
            gameState.cameraX = 0;
        }
        
        function nextLevel() {
            gameState.level++;
            gameState.score += 500;
            updateUI();
            
            if (gameState.level > 3) {
                gameWin();
            } else {
                generateLevel();
                resetPlayer();
                showMessage('关卡 ' + gameState.level, '准备好了吗？', false);
            }
        }
        
        function gameOver() {
            gameState.isPlaying = false;
            showMessage('游戏结束', '最终得分: ' + gameState.score, true);
        }
        
        function gameWin() {
            gameState.isPlaying = false;
            showMessage('恭喜通关!', '最终得分: ' + gameState.score, true);
        }
        
        function updateUI() {
            document.getElementById('score').textContent = gameState.score;
            document.getElementById('coins').textContent = gameState.coins;
            document.getElementById('lives').textContent = gameState.lives;
            document.getElementById('level').textContent = gameState.level;
            
            const scoreP = document.getElementById('score-portrait');
            const coinsP = document.getElementById('coins-portrait');
            const livesP = document.getElementById('lives-portrait');
            const levelP = document.getElementById('level-portrait');
            if (scoreP) scoreP.textContent = gameState.score;
            if (coinsP) coinsP.textContent = gameState.coins;
            if (livesP) livesP.textContent = gameState.lives;
            if (levelP) levelP.textContent = gameState.level;
        }
        
        function showMessage(title, text, showRestart) {
            document.getElementById('messageTitle').textContent = title;
            document.getElementById('messageText').innerHTML = text;
            document.getElementById('messageOverlay').style.display = 'flex';
            
            const btn = document.querySelector('.pixel-btn');
            btn.textContent = showRestart ? '重新开始' : '继续';
            btn.onclick = showRestart ? restartGame : hideMessage;
        }
        
        function hideMessage() {
            document.getElementById('messageOverlay').style.display = 'none';
        }
        
        function startGame() {
            hideMessage();
            gameState = {
                score: 0,
                coins: 0,
                lives: 3,
                level: 1,
                isPlaying: true,
                isPaused: false,
                cameraX: 0
            };
            updateUI();
            generateLevel();
            resetPlayer();
            gameLoop();
        }
        
        function restartGame() {
            startGame();
        }
        
        function gameLoop() {
            if (!gameState.isPlaying) return;
            
            pollGamepad();
            
            ctx.clearRect(0, 0, canvasWidth, canvasHeight);
            
            drawBackground();
            
            platforms.forEach(platform => {
                if (platform.type === 'ground') {
                    drawGround(platform.x, platform.y);
                } else {
                    drawBrick(platform.x, platform.y);
                }
            });
            
            coins.forEach(coin => drawCoin(coin));
            enemies.forEach(enemy => drawEnemy(enemy));
            drawPlayer();
            drawParticles();
            
            updatePlayer();
            updateEnemies();
            updateCoins();
            
            requestAnimationFrame(gameLoop);
        }

        function checkExistingGamepads() {
            const gamepads = navigator.getGamepads();
            for (let i = 0; i < gamepads.length; i++) {
                if (gamepads[i]) {
                    gamepadIndex = i;
                    gamepadConnected = true;
                    document.getElementById('gamepadIndicator').classList.add('connected');
                    document.getElementById('controllerHint').textContent = '🎮 ' + gamepads[i].id.substring(0, 20) + '...';
                    console.log('Existing gamepad found:', gamepads[i].id);
                    break;
                }
            }
        }
        
        checkExistingGamepads();
        checkOrientation();
    </script>
</body>
</html>
