<!--
文件作用：测试HTML插件应用，包含计数器、主题颜色切换、待办事项和统计信息
依赖：无（纯原生JavaScript）
输入：用户点击按钮、选择颜色、输入待办事项
输出：实时显示计数值、更新主题颜色、显示待办事项列表、统计使用数据
实现方式：使用JavaScript变量存储状态，通过DOM操作更新界面，LocalStorage用于数据持久化
-->
<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>测试插件</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%);
            color: #ffffff;
            min-height: 100vh;
            overflow-x: hidden;
        }

        .container {
            max-width: 600px;
            margin: 0 auto;
            padding: 20px;
        }

        .header {
            text-align: center;
            padding: 30px 0;
            border-bottom: 2px solid rgba(255, 255, 255, 0.1);
            margin-bottom: 30px;
        }

        .header h1 {
            font-size: 32px;
            font-weight: 300;
            letter-spacing: 2px;
            color: #f57309;
            margin-bottom: 10px;
        }

        .header p {
            font-size: 14px;
            color: rgba(255, 255, 255, 0.6);
        }

        .card {
            background: rgba(255, 255, 255, 0.05);
            border-radius: 16px;
            padding: 24px;
            margin-bottom: 20px;
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            transition: all 0.3s ease;
        }

        .card:hover {
            transform: translateY(-2px);
            background: rgba(255, 255, 255, 0.08);
            border-color: rgba(245, 115, 9, 0.3);
        }

        .card-title {
            font-size: 18px;
            font-weight: 500;
            margin-bottom: 16px;
            color: #f57309;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .counter-section {
            text-align: center;
        }

        .counter-display {
            font-size: 64px;
            font-weight: 200;
            color: #ffffff;
            margin: 20px 0;
            transition: all 0.2s ease;
        }

        .counter-buttons {
            display: flex;
            gap: 12px;
            justify-content: center;
            flex-wrap: wrap;
        }

        .btn {
            padding: 12px 32px;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.2s ease;
            background: #f57309;
            color: #ffffff;
        }

        .btn:hover {
            background: #ff8c3b;
            transform: scale(1.05);
        }

        .btn:active {
            transform: scale(0.95);
        }

        .btn-secondary {
            background: rgba(255, 255, 255, 0.1);
        }

        .btn-secondary:hover {
            background: rgba(255, 255, 255, 0.2);
        }

        .color-picker {
            display: flex;
            gap: 12px;
            justify-content: center;
            flex-wrap: wrap;
            margin-top: 16px;
        }

        .color-option {
            width: 48px;
            height: 48px;
            border-radius: 50%;
            border: 3px solid transparent;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .color-option:hover {
            transform: scale(1.1);
        }

        .color-option.active {
            border-color: #ffffff;
            box-shadow: 0 0 20px rgba(255, 255, 255, 0.3);
        }

        .todo-list {
            list-style: none;
        }

        .todo-item {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 12px;
            background: rgba(255, 255, 255, 0.03);
            border-radius: 8px;
            margin-bottom: 8px;
            transition: all 0.2s ease;
        }

        .todo-item:hover {
            background: rgba(255, 255, 255, 0.06);
        }

        .todo-checkbox {
            width: 20px;
            height: 20px;
            border: 2px solid rgba(255, 255, 255, 0.3);
            border-radius: 4px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.2s ease;
        }

        .todo-checkbox.checked {
            background: #f57309;
            border-color: #f57309;
        }

        .todo-checkbox.checked::after {
            content: '✓';
            color: #ffffff;
            font-size: 12px;
        }

        .todo-text {
            flex: 1;
            font-size: 14px;
            transition: all 0.2s ease;
        }

        .todo-text.completed {
            text-decoration: line-through;
            opacity: 0.5;
        }

        .todo-delete {
            color: #ff4757;
            cursor: pointer;
            font-size: 18px;
            opacity: 0;
            transition: all 0.2s ease;
        }

        .todo-item:hover .todo-delete {
            opacity: 1;
        }

        .todo-input {
            width: 100%;
            padding: 12px 16px;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 8px;
            color: #ffffff;
            font-size: 14px;
            margin-bottom: 12px;
            outline: none;
            transition: all 0.2s ease;
        }

        .todo-input:focus {
            border-color: #f57309;
            background: rgba(255, 255, 255, 0.08);
        }

        .todo-input::placeholder {
            color: rgba(255, 255, 255, 0.4);
        }

        .status-section {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 12px;
        }

        .status-item {
            text-align: center;
            padding: 16px;
            background: rgba(255, 255, 255, 0.03);
            border-radius: 12px;
        }

        .status-value {
            font-size: 24px;
            font-weight: 600;
            color: #f57309;
            margin-bottom: 4px;
        }

        .status-label {
            font-size: 12px;
            color: rgba(255, 255, 255, 0.6);
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .footer {
            text-align: center;
            padding: 30px;
            color: rgba(255, 255, 255, 0.4);
            font-size: 12px;
        }

        @keyframes pulse {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.1); }
        }

        .pulse {
            animation: pulse 0.3s ease;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>测试插件</h1>
            <p>HTML 插件应用示例</p>
        </div>

        <div class="card">
            <div class="card-title">
                <span>📊</span> 计数器
            </div>
            <div class="counter-section">
                <div class="counter-display" id="counter">0</div>
                <div class="counter-buttons">
                    <button class="btn btn-secondary" onclick="decrementCounter()">-1</button>
                    <button class="btn" onclick="incrementCounter()">+1</button>
                    <button class="btn btn-secondary" onclick="resetCounter()">重置</button>
                </div>
            </div>
        </div>

        <div class="card">
            <div class="card-title">
                <span>🎨</span> 主题颜色
            </div>
            <div class="color-picker" id="colorPicker">
                <div class="color-option active" style="background: #f57309;" data-color="#f57309"></div>
                <div class="color-option" style="background: #3498db;" data-color="#3498db"></div>
                <div class="color-option" style="background: #2ecc71;" data-color="#2ecc71"></div>
                <div class="color-option" style="background: #9b59b6;" data-color="#9b59b6"></div>
                <div class="color-option" style="background: #e74c3c;" data-color="#e74c3c"></div>
            </div>
        </div>

        <div class="card">
            <div class="card-title">
                <span>✅</span> 待办事项
            </div>
            <input type="text" class="todo-input" id="todoInput" placeholder="添加新的待办事项..." onkeypress="handleTodoKeypress(event)">
            <ul class="todo-list" id="todoList">
                <li class="todo-item">
                    <div class="todo-checkbox" onclick="toggleTodo(this)"></div>
                    <span class="todo-text">测试插件功能</span>
                    <span class="todo-delete" onclick="deleteTodo(this)">×</span>
                </li>
                <li class="todo-item">
                    <div class="todo-checkbox" onclick="toggleTodo(this)"></div>
                    <span class="todo-text">检查WebView兼容性</span>
                    <span class="todo-delete" onclick="deleteTodo(this)">×</span>
                </li>
            </ul>
        </div>

        <div class="card">
            <div class="card-title">
                <span>📈</span> 统计信息
            </div>
            <div class="status-section">
                <div class="status-item">
                    <div class="status-value" id="clickCount">0</div>
                    <div class="status-label">点击次数</div>
                </div>
                <div class="status-item">
                    <div class="status-value" id="todoCount">2</div>
                    <div class="status-label">待办事项</div>
                </div>
                <div class="status-item">
                    <div class="status-value" id="timeElapsed">0s</div>
                    <div class="status-label">使用时间</div>
                </div>
            </div>
        </div>

        <div class="footer">
            <p>NeoPod 测试插件 © 2024</p>
        </div>
    </div>

    <script>
        let counter = 0;
        let clickCount = 0;
        let startTime = Date.now();
        let accentColor = '#f57309';

        function incrementCounter() {
            counter++;
            updateCounter();
            trackClick();
        }

        function decrementCounter() {
            counter--;
            updateCounter();
            trackClick();
        }

        function resetCounter() {
            counter = 0;
            updateCounter();
            trackClick();
        }

        function updateCounter() {
            const counterEl = document.getElementById('counter');
            counterEl.textContent = counter;
            counterEl.classList.add('pulse');
            setTimeout(() => counterEl.classList.remove('pulse'), 300);
        }

        function trackClick() {
            clickCount++;
            document.getElementById('clickCount').textContent = clickCount;
        }

        function handleTodoKeypress(event) {
            if (event.key === 'Enter') {
                addTodo();
            }
        }

        function addTodo() {
            const input = document.getElementById('todoInput');
            const text = input.value.trim();
            
            if (text) {
                const todoList = document.getElementById('todoList');
                const todoItem = document.createElement('li');
                todoItem.className = 'todo-item';
                todoItem.innerHTML = `
                    <div class="todo-checkbox" onclick="toggleTodo(this)"></div>
                    <span class="todo-text">${text}</span>
                    <span class="todo-delete" onclick="deleteTodo(this)">×</span>
                `;
                todoList.appendChild(todoItem);
                input.value = '';
                updateTodoCount();
                trackClick();
            }
        }

        function toggleTodo(checkbox) {
            checkbox.classList.toggle('checked');
            const text = checkbox.nextElementSibling;
            text.classList.toggle('completed');
            trackClick();
        }

        function deleteTodo(deleteBtn) {
            const todoItem = deleteBtn.parentElement;
            todoItem.style.opacity = '0';
            todoItem.style.transform = 'translateX(20px)';
            setTimeout(() => {
                todoItem.remove();
                updateTodoCount();
            }, 200);
            trackClick();
        }

        function updateTodoCount() {
            const todoList = document.getElementById('todoList');
            const count = todoList.children.length;
            document.getElementById('todoCount').textContent = count;
        }

        function updateTimeElapsed() {
            const elapsed = Math.floor((Date.now() - startTime) / 1000);
            const minutes = Math.floor(elapsed / 60);
            const seconds = elapsed % 60;
            
            if (minutes > 0) {
                document.getElementById('timeElapsed').textContent = `${minutes}m ${seconds}s`;
            } else {
                document.getElementById('timeElapsed').textContent = `${seconds}s`;
            }
        }

        function initColorPicker() {
            const colorOptions = document.querySelectorAll('.color-option');
            colorOptions.forEach(option => {
                option.addEventListener('click', function() {
                    colorOptions.forEach(opt => opt.classList.remove('active'));
                    this.classList.add('active');
                    accentColor = this.dataset.color;
                    updateAccentColor();
                    trackClick();
                });
            });
        }

        function updateAccentColor() {
            document.querySelectorAll('.card-title, .counter-display, .status-value, .btn').forEach(el => {
                el.style.color = accentColor;
            });
            
            document.querySelectorAll('.btn').forEach(btn => {
                if (!btn.classList.contains('btn-secondary')) {
                    btn.style.backgroundColor = accentColor;
                }
            });

            document.querySelectorAll('.todo-checkbox.checked').forEach(checkbox => {
                checkbox.style.backgroundColor = accentColor;
                checkbox.style.borderColor = accentColor;
            });
        }

        setInterval(updateTimeElapsed, 1000);
        initColorPicker();
    </script>
</body>
</html>
